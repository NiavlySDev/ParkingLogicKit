<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <title>ParkingLogicKit</title>
        <link rel="stylesheet" type="text/css" href="#{request.contextPath}/resources/style.css?v=5" />
        <script type="text/javascript" src="#{request.contextPath}/assets/js/theme.js?v=2"></script>
        <script type="text/javascript" src="#{request.contextPath}/assets/js/settings.js?v=2"></script>
        <link rel="icon" type="image/png" href="#{request.contextPath}/favicon.png" />
        <script type="text/javascript">
            window.PLKLoader = {
                timer: null,
                showDelayed: function () {
                    this.hide();
                    this.timer = window.setTimeout(function () {
                        var loader = document.getElementById('pageLoader');
                        if (loader) {
                            loader.classList.add('is-visible');
                        }
                    }, 350);
                },
                hide: function () {
                    if (this.timer) {
                        window.clearTimeout(this.timer);
                        this.timer = null;
                    }
                    var loader = document.getElementById('pageLoader');
                    if (loader) {
                        loader.classList.remove('is-visible');
                    }
                }
            };
        </script>
    </h:head>
    <h:body>
        <!-- Bouton toggle Dark / Light (fixe, visible partout) -->
        <button class="theme-toggle" onclick="toggleTheme()" title="Basculer le thème">
            <span class="toggle-track">
                <span class="toggle-thumb"></span>
            </span>
            <span class="toggle-label-light">☀&#xFE0F; Clair</span>
            <span class="toggle-label-dark">🌙 Sombre</span>
        </button>

        <div class="main-container">
            <h:form id="index">
                <div class="navigation-bar">
                    <p:tabMenu id="tabMenu"
                               model="#{navBean.model}"
                               activeIndex="#{navBean.activeIndex}"/>
                    <h:panelGroup layout="block" styleClass="account-dropdown" rendered="#{loginBean.logged}">
                        <p:menuButton value="#{loginBean.driver.username}"
                                      icon="pi pi-user"
                                      styleClass="account-chip">
                            <p:menuitem value="Mon Compte"
                                        icon="pi pi-user"
                                        action="#{navBean.onTabChange('Compte')}"
                                        process="@this"
                                        update="index:fragmentPanel messageindex message index:tabMenu"/>
                            <p:menuitem value="Se Déconnecter"
                                        icon="pi pi-sign-out"
                                        action="#{loginBean.logout()}"
                                        process="@this"
                                        update="index:fragmentPanel messageindex message index:tabMenu"/>
                        </p:menuButton>
                    </h:panelGroup>
                </div>
                <p:messages id="messageindex" showDetail="true" closable="true" />
                <p:growl id="message" showDetail="true" />
                <p:poll interval="30"
                        listener="#{navBean.refreshCurrentPage()}"
                        global="false"
                        process="@this"
                        update="#{navBean.refreshUpdateTargets}" />
                <h:panelGroup id="fragmentPanel" layout="block">
                    <ui:include src="#{navBean.path}" />
                </h:panelGroup>
            </h:form>
        </div>
        <p:ajaxStatus onstart="PLKLoader.showDelayed()"
                      onsuccess="PLKLoader.hide()"
                      onerror="PLKLoader.hide()"/>
        <div id="pageLoader" class="page-loader">
            <div class="page-loader-panel">
                <span class="page-loader-spinner"></span>
                <span>Chargement...</span>
            </div>
        </div>
    </h:body>
</html>
