<?xml version = "1.0" encoding = "UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <title>ParkingLogicKit</title>
        <link rel="stylesheet" type="text/css" href="#{request.contextPath}/resources/style.css" />
        <script type="text/javascript">
            //<![CDATA[
            (function () {
                if (localStorage.getItem('plk-theme') === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            })();

            function toggleTheme() {
                var root = document.documentElement;
                if (root.getAttribute('data-theme') === 'dark') {
                    root.removeAttribute('data-theme');
                    localStorage.removeItem('plk-theme');
                } else {
                    root.setAttribute('data-theme', 'dark');
                    localStorage.setItem('plk-theme', 'dark');
                }
            }
            //]]>
        </script>
        <link rel="icon" type="image/png" href="#{request.contextPath}/favicon.png" />
    </h:head>
    <h:body>
        <!-- Bouton toggle Dark / Light (fixe, visible partout) -->
        <button class="theme-toggle" onclick="toggleTheme()" title="Basculer le thème">
            <span class="toggle-track">
                <span class="toggle-thumb"></span>
            </span>
            <span class="toggle-label-light">☀&#xFE0F; Clair</span>
            <span class="toggle-label-dark">🌙 Sombre</span>
        </button>

        <div class="main-container">
            <h:form id="index">
                <p:tabMenu id="tabMenu"
                    model="#{navBean.model}"
                    activeIndex="#{navBean.activeIndex}"/>
                <p:messages id="messageindex" showDetail="true" closable="true" />
                <p:growl id="message" showDetail="true" />
                <h:panelGroup id="fragmentPanel" layout="block">
                    <ui:include src="#{navBean.path}" />
                </h:panelGroup>
            </h:form>
        </div>
    </h:body>
</html>
