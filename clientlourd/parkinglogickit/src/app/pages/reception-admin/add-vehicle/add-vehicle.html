<div class="add-vehicle">
  <button class="home-button" (click)="goHome()" aria-label="Accueil">
    <img src="logo-home.png" alt="Accueil" class="home-logo" />
  </button>
  <div class="add-vehicle-card">
    <h1 class="add-vehicle-title">Création véhicule</h1>
    <form class="add-vehicle-form" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="brand">Brand</label>
        <input
          type="text"
          id="brand"
          class="form-input"
          [(ngModel)]="brand"
          name="brand"
          placeholder="Entrez la marque"
          required
        />
      </div>

      <div class="form-group">
        <label for="numberPlate">Number plate</label>
        <input
          type="text"
          id="numberPlate"
          class="form-input"
          [(ngModel)]="numberPlate"
          name="numberPlate"
          placeholder="Entrez la plaque"
          required
                />
      </div>

      <div class="form-group">
        <label for="selectedVehicleType">Type</label>
        <select
          id="selectedVehicleType"
          class="form-input"
          [(ngModel)]="selectedVehicleType"
          name="selectedVehicleType"
          required
        >
          <option [ngValue]="null" disabled>Sélectionnez un type</option>
          <option [ngValue]="0">Moto</option>
          <option [ngValue]="1">Voiture</option>
          <option [ngValue]="2">Camionnette</option>
          <option [ngValue]="3">Camion</option>
        </select>
      </div>

      <div class="form-group">
        <label for="badgeContent">Numéro de Badge RFID</label>
        <input
          type="text"
          id="badgeContent"
          class="form-input"
          [(ngModel)]="badgeContent"
          name="badgeContent"
          placeholder="Entrez le numéro de badge"
          required
        />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit" [disabled]="isLoading">
          {{ isLoading ? 'Chargement...' : "S'inscrire" }}
        </button>
      </div>

    </form>

    <div *ngIf="message" class="message" [ngClass]="'message-' + messageType">
      {{ message }}
    </div>
  </div>
</div>
