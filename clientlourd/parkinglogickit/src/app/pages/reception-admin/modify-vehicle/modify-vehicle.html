<div class="modify-vehicle">
  <button class="home-button" (click)="goHome()" aria-label="Accueil">
    <img src="logo-home.png" alt="Accueil" class="home-logo" />
  </button>

  <div class="modify-vehicle-card">
    <h1 class="modify-vehicle-title">Modification Vehicle</h1>

    <form class="modify-vehicle-form" (ngSubmit)="onSubmit()">
      <!-- Selection Vehicle -->
      <div class="form-group">
        <label for="Vehicle">Choisir</label>
        <div class="card flex justify-center">
          <p-select
            [options]="vehicles"
            [(ngModel)]="selectedVehicle"
            name="selectedDriver"
            optionLabel="fullName"
            placeholder="Choisir un Vehicle"
            (onChange)="changeVehicle()"
          />
        </div>
      </div>

      <!-- Marque -->
      <div class="form-group">
        <label for="brand">Brand</label>
        <input
          type="text"
          id="brand"
          class="form-input"
          [(ngModel)]="brand"
          name="brand"
          placeholder="Entrez la marque"
          required
        />
      </div>

      <!-- NumberPlate -->
      <div class="form-group">
        <label for="numberPlate">numberPlate</label>
        <input
          type="text"
          id="numberPlate"
          class="form-input"
          [(ngModel)]="numberPlate"
          name="numberPlate"
          placeholder="Entrez la plaque d'immatriculation"
          required
        />
      </div>

      <!-- Type vehicle -->
      <div class="form-group">
        <label for="VehicleType">Type de vehicle</label>
        <select id="VehicleType" class="form-input" [(ngModel)]="Type" name="VehicleType" required>
          <option [ngValue]="null" disabled>Sélectionnez un type</option>
          <option [ngValue]="0">Moto</option>
          <option [ngValue]="1">Voiture</option>
          <option [ngValue]="2">Camionnette</option>
          <option [ngValue]="3">Camion</option>
        </select>
      </div>

      <!-- Bouton Submit -->
      <div class="form-actions">
        <button type="submit" class="btn-submit" [disabled]="isLoading">
          {{ isLoading ? 'Chargement...' : 'Confirmer Modification' }}
        </button>
      </div>
    </form>

    <!-- Messages -->
    <div *ngIf="message" class="message" [ngClass]="'message-' + messageType">
      {{ message }}
    </div>
  </div>
</div>
