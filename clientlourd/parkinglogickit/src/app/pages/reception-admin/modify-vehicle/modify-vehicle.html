<div class="modify-vehicle">
  <button class="home-button" (click)="goHome()" aria-label="Accueil">
    <img src="logo-home.png" alt="Accueil" class="home-logo" />
  </button>

  <div class="modify-vehicle-card">
    <h1 class="modify-vehicle-title">Modification Véhicule</h1>

    <form class="modify-vehicle-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="Vehicle">Sélectionner un véhicule</label>
        <div class="card flex justify-center">
          <p-select
            [options]="vehicles"
            [(ngModel)]="selectedVehicle"
            name="selectedVehicle" 
            optionLabel="fullName"
            placeholder="Choisir un Véhicule"
            (onChange)="changeVehicle()"
            [style]="{'width':'100%'}"
          ></p-select>
        </div>
      </div>

      <div class="form-group">
        <label for="brand">Marque</label>
        <input
          type="text"
          id="brand"
          class="form-input"
          [(ngModel)]="brand"
          name="brand"
          placeholder="Entrez la marque"
          required
        />
      </div>

      <div class="form-group">
        <label for="numberPlate">Plaque d'immatriculation</label>
        <input
          type="text"
          id="numberPlate"
          class="form-input"
          [(ngModel)]="numberPlate"
          name="numberPlate"
          placeholder="Ex: AB-123-CD"
          required
        />
      </div>

      <div class="form-group">
        <label for="VehicleType">Type de véhicule</label>
        <select 
          id="VehicleType" 
          class="form-input" 
          [(ngModel)]="selectedVehicleType" 
          name="selectedVehicleType" 
          required
        >
          <option [ngValue]="null" disabled>Sélectionnez un type</option>
          <option [ngValue]="0">Moto</option>
          <option [ngValue]="1">Voiture</option>
          <option [ngValue]="2">Camionnette</option>
          <option [ngValue]="3">Camion</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit" [disabled]="isLoading">
          <span *ngIf="isLoading">Chargement...</span>
          <span *ngIf="!isLoading">Confirmer Modification</span>
        </button>
      </div>
    </form>

    <div *ngIf="message" class="message" [ngClass]="'message-' + messageType">
      {{ message }}
    </div>
  </div>
</div>
