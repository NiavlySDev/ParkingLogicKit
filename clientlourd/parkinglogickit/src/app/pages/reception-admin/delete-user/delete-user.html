<div class="sign-up">
  <button class="home-button" (click)="goHome()" aria-label="Accueil">
    <img src="logo-home.png" alt="Accueil" class="home-logo" />
  </button>

  <div class="sign-up-card">
    <h1 class="sign-up-title">Supprimer un driver</h1>

    <form class="sign-up-form" (ngSubmit)="onSubmit()">
      <!-- Selection Driver -->
      <div class="form-group">
        <label for="firstName">Choisir</label>
        <div class="card flex justify-center">
          <p-select
            [options]="drivers"
            [(ngModel)]="selectedDriver"
            name="selectedDriver"
            optionLabel="fullName"
            placeholder="Choisir un Driver"
            (onChange)="changeDriver()"
          />
        </div>
      </div>

      <!-- Bouton Submit -->
      <div class="form-actions">
        <button type="submit" class="btn-submit" [disabled]="isLoading">
          {{ isLoading ? 'Chargement...' : 'Confirmer la suppression' }}
        </button>
      </div>
    </form>

    <!-- Messages -->
    <div *ngIf="message" class="message" [ngClass]="'message-' + messageType">
      {{ message }}
    </div>
  </div>
</div>
