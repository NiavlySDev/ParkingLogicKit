<!-- author Ethan-->
<head>
    <meta charset="UTF-8" />
    <title>Accueil Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="reception-admin.css" />
  </head>
  <body>
  
  <div class="app-wrapper">
  
    <p-menubar [model]="menuItems"></p-menubar>
  
    <main class="container">
      <p-card>
        <h1>Bienvenue {{ username }} !</h1>
        <p>Sur le panneau d'administration de ParkingLogicKit</p>
  
        <div class="actions">
          <p-button
            label="Créer un compte"
            icon="pi pi-user-plus"
            [routerLink]="['/sign-up']"
            size="large"
            [rounded]="true"
            severity="success"
          ></p-button>
          <p-button
            label="Modifier un compte"
            icon="pi pi-user-edit"
            [routerLink]="['/']"
            size="large"
            [rounded]="true"
            severity="info"
          ></p-button>
          <p-button
            label="Supprimer un compte"
            icon="pi pi-user-minus"
            [routerLink]="['/']"
            size="large"
            [rounded]="true"
            severity="danger"
          ></p-button>
        </div>
      </p-card>
    </main>
  
  </div>
  
  </body>
