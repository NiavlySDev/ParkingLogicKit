<div class="sign-up">
  <!-- BOUTON HOME -->
  <button class="home-button" (click)="goHome()" aria-label="Accueil">
    <img src="logo-home.png" alt="Accueil" class="home-logo" />
  </button>

  <div class="sign-up-card">
    <h1 class="sign-up-title">Inscription</h1>

    <form class="sign-up-form" (ngSubmit)="onSubmit()">
      <!-- Prénom -->
      <div class="form-group">
        <label for="firstName">Prénom</label>
        <input
          type="text"
          id="firstName"
          class="form-input"
          [(ngModel)]="firstname"
          name="firstName"
          placeholder="Entrez votre prénom"
          required
        />
      </div>

      <!-- Nom -->
      <div class="form-group">
        <label for="lastName">Nom de famille</label>
        <input
          type="text"
          id="lastName"
          class="form-input"
          [(ngModel)]="lastName"
          name="lastName"
          placeholder="Entrez votre nom"
          required
        />
      </div>

      <!-- username -->
      <div class="form-group">
        <label for="username">username</label>
        <input
          type="text"
          id="username"
          class="form-input"
          [(ngModel)]="username"
          name="username"
          placeholder="Entrez votre username"
          required
        />
      </div>

      <!-- Mot de passe -->
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          class="form-input"
          [(ngModel)]="password"
          name="password"
          placeholder="Entrez votre mot de passe"
          required
        />
      </div>

      <!-- Âge -->
      <div class="form-group">
        <label for="age">Âge</label>
        <input
          type="number"
          id="age"
          class="form-input"
          [(ngModel)]="age"
          name="age"
          min="1"
          max="120"
          placeholder="Entrez votre âge"
          required
        />
      </div>

      <!-- Genre -->
      <div class="form-group">
        <label for="isMale">Genre</label>
        <select
          id="isMale"
          class="form-input"
          [(ngModel)]="isMale"
          name="isMale"
          required
        >
          <option [ngValue]="null" disabled>Sélectionnez votre genre</option>
          <option [ngValue]="true">Masculin</option>
          <option [ngValue]="false">Féminin</option>
        </select>
      </div>

      <!-- Type utilisateur -->
      <div class="form-group">
        <label for="DriverType">Type d'utilisateur</label>
        <select
          id="DriverType"
          class="form-input"
          [(ngModel)]="DriverType"
          name="DriverType"
          required
        >
          <option [ngValue]="null" disabled>Sélectionnez un type</option>
          <option [ngValue]="0">Administrator</option>
          <option [ngValue]="1">Maintenance</option>
          <option [ngValue]="2">Driver</option>
        </select>
      </div>

      <!-- Ajouter un véhicule -->
      <div class="form-group">
        <label for="addCar">Ajouter un véhicule</label>
        <select id="addCar" class="form-input" [(ngModel)]="addCar" name="addCar" required>
          <option [ngValue]="null" disabled>Sélectionnez un véhicule</option>
          <option [ngValue]="VehicleType.Car">Voiture</option>
          <option [ngValue]="VehicleType.Motorcycle">Moto</option>
          <option [ngValue]="VehicleType.Van">Camionnette</option>
        </select>
      </div>

      <!-- Bouton Submit -->
      <div class="form-actions">
        <button type="submit" class="btn-submit" [disabled]="isLoading">
          {{ isLoading ? 'Chargement...' : "S'inscrire" }}
        </button>
      </div>
    </form>

    <!-- Messages -->
    <div *ngIf="message" class="message" [ngClass]="'message-' + messageType">
      {{ message }}
    </div>
  </div>
</div>
