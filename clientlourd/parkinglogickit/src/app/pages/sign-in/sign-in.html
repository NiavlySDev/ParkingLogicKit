<div class="sign-in">
  <button class="home-button" (click)="goHome()" aria-label="Accueil">
    <img src="logo-home.png" alt="Accueil" class="home-logo" />
  </button>

  <button class="settings-button" (click)="goSettings()" aria-label="Parametres">
    <i class="pi pi-cog"></i>
  </button>

  <div class="sign-in-card">
    <h1 class="sign-in-title">Connexion</h1>

    <form class="sign-in-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username" class="form-label">Nom d'utilisateur</label>
        <input
          type="text"
          id="username"
          class="form-input"
          [(ngModel)]="username"
          name="username"
          placeholder="Entrez votre username"
          required
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Mot de passe</label>
        <div class="password-row">
          <div class="password-container">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              class="form-input"
              [(ngModel)]="password"
              name="password"
              placeholder="Entrez votre mot de passe"
              required
            />
            <button
              type="button"
              class="toggle-password"
              (click)="showPassword = !showPassword"
              [aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
              [title]="showPassword ? 'Masquer' : 'Afficher'"
            >
              <i [class]="showPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
            </button>
          </div>
          <button type="button" class="password-action" (click)="generateMdp()" aria-label="Générer" title="Générer">
            <i class="pi pi-refresh"></i>
          </button>
          <button type="button" class="password-action" (click)="copyMdp()" aria-label="Copier" title="Copier">
            <i class="pi pi-copy"></i>
          </button>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit" [disabled]="isLoading">
          {{ isLoading ? 'Chargement...' : 'Se connecter' }}
        </button>
      </div>
    </form>

    <div *ngIf="message" class="message" [ngClass]="'message-' + messageType">
      {{ message }}
    </div>

    <small class="app-version">Version {{ appVersion }}</small>
  </div>
</div>
