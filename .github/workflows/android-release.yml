name: Build Android APK Release

on:
  push:
    branches:
      - main
    paths:
      - "clientlourd/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Create APK release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clientlourd/parkinglogickit
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next release version
        id: version
        shell: bash
        run: |
          git fetch --tags --force
          latest="$(git tag --list 'v1.*' --sort=-v:refname | head -n 1)"

          if [[ -z "$latest" ]]; then
            version="v1.0"
            version_name="1.0"
            version_code="10000"
          elif [[ "$latest" == "v1.0" ]]; then
            version="v1.0.1"
            version_name="1.0.1"
            version_code="10001"
          elif [[ "$latest" =~ ^v1\.([0-9]+)\.([0-9]+)$ ]]; then
            minor="${BASH_REMATCH[1]}"
            patch="${BASH_REMATCH[2]}"
            if (( patch < 9 )); then
              ((patch += 1))
            else
              ((minor += 1))
              patch=0
            fi
            version="v1.${minor}.${patch}"
            version_name="1.${minor}.${patch}"
            version_code="$((10000 + minor * 10 + patch))"
          else
            echo "Unsupported existing tag format: $latest" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$latest" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clientlourd/parkinglogickit/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up npm
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build

      - name: Synchronize Capacitor Android project
        run: npx cap sync android

      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore

      - name: Build APK
        working-directory: clientlourd/parkinglogickit/android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          bash ./gradlew assembleRelease \
            -PVERSION_NAME="${{ steps.version.outputs.version_name }}" \
            -PVERSION_CODE="${{ steps.version.outputs.version_code }}" \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk ../plk.apk

      - name: Create release notes from commits
        env:
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          if [ -n "$PREVIOUS_TAG" ]; then
            range="$PREVIOUS_TAG..$GITHUB_SHA"
            heading="## Changements depuis $PREVIOUS_TAG"
          else
            range="$GITHUB_SHA"
            heading="## Changements"
          fi

          {
            echo "$heading"
            echo
            commits="$(git log --no-merges --pretty=format:'- %s (`%h`)' "$range")"
            if [ -n "$commits" ]; then
              printf '%s\n' "$commits"
            else
              echo "- Aucun commit hors merge depuis la version precedente."
            fi
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create update manifest asset
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          remote_manifest_path=""
          if git fetch --depth=1 origin android-update-manifest >/dev/null 2>&1 \
            && git show FETCH_HEAD:update-manifest.json > "$RUNNER_TEMP/source-update-manifest.json" 2>/dev/null; then
            remote_manifest_path="$RUNNER_TEMP/source-update-manifest.json"
          fi
          export REMOTE_MANIFEST_PATH="$remote_manifest_path"
          export DOCS_MANIFEST_PATH="../../docs/update-manifest.json"

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          version = os.environ["VERSION"]
          repository = os.environ["REPOSITORY"]
          server_url = os.environ["SERVER_URL"]
          notes_path = Path(os.environ["RUNNER_TEMP"]) / "release-notes.md"
          remote_manifest_path = os.environ["REMOTE_MANIFEST_PATH"]
          docs_manifest_path = Path(os.environ["DOCS_MANIFEST_PATH"])
          output_manifest_path = Path(os.environ["RUNNER_TEMP"]) / "update-manifest.json"

          manifests = []
          if docs_manifest_path.exists():
            manifests.append(json.loads(docs_manifest_path.read_text(encoding="utf-8")))
          if remote_manifest_path and Path(remote_manifest_path).exists():
            manifests.append(json.loads(Path(remote_manifest_path).read_text(encoding="utf-8")))

          release = {
            "version": version,
            "title": version,
            "publishedAt": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
            "body": notes_path.read_text(encoding="utf-8"),
            "apkUrl": f"{server_url}/{repository}/releases/download/{version}/plk.apk",
            "htmlUrl": f"{server_url}/{repository}/releases/tag/{version}",
          }

          releases_by_version = {}
          for manifest_item in manifests:
            latest = manifest_item.get("latest")
            if latest and latest.get("version") != version:
              releases_by_version[latest["version"]] = latest
            for item in manifest_item.get("releases", []):
              if item.get("version") and item.get("version") != version:
                releases_by_version[item["version"]] = item

          previous = sorted(
            releases_by_version.values(),
            key=lambda item: item.get("publishedAt", ""),
            reverse=True,
          )
          manifest = {}
          manifest["latest"] = release
          manifest["releases"] = [release] + previous[:9]

          output_manifest_path.write_text(
            json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
            encoding="utf-8"
          )
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            plk.apk \
            "$RUNNER_TEMP/update-manifest.json" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "$GITHUB_SHA"

      - name: Publish update manifest branch
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISH_BRANCH: android-update-manifest
        run: |
          publish_dir="$RUNNER_TEMP/update-manifest-publish"
          mkdir -p "$publish_dir"
          cd "$publish_dir"

          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads origin "$PUBLISH_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$PUBLISH_BRANCH"
            git checkout -B "$PUBLISH_BRANCH" FETCH_HEAD
          else
            git checkout --orphan "$PUBLISH_BRANCH"
          fi

          cp "$RUNNER_TEMP/update-manifest.json" update-manifest.json
          git add update-manifest.json
          git commit -m "Update Android release manifest for $VERSION" || exit 0
          git push origin "$PUBLISH_BRANCH"

      - name: Send APK to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_ANDROID_RELEASE }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}
        run: |
          test -n "$DISCORD_WEBHOOK_URL"
          curl --fail-with-body \
            -F "payload_json={\"content\":\"Nouvelle release Android **${VERSION}** disponible : ${RELEASE_URL}\"}" \
            -F "files[0]=@plk.apk;type=application/vnd.android.package-archive;filename=plk.apk" \
            "$DISCORD_WEBHOOK_URL"
