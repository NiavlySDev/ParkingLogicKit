name: Build iPhone IPA Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    name: Create IPA release
    runs-on: macos-latest
    defaults:
      run:
        working-directory: clientlourd/parkinglogickit
    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'ParkingLogicKit.LML' }}
      IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'ad-hoc' }}
      IOS_CODE_SIGN_IDENTITY: ${{ vars.IOS_CODE_SIGN_IDENTITY || 'Apple Distribution' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next release version
        id: version
        shell: bash
        run: |
          git fetch --tags --force
          latest="$(git tag --list 'ios-v1.*' --sort=-v:refname | head -n 1)"

          if [[ -z "$latest" ]]; then
            version="ios-v1.0"
            version_name="1.0"
            version_code="10000"
          elif [[ "$latest" == "ios-v1.0" ]]; then
            version="ios-v1.0.1"
            version_name="1.0.1"
            version_code="10001"
          elif [[ "$latest" =~ ^ios-v1\.([0-9]+)\.([0-9]+)$ ]]; then
            minor="${BASH_REMATCH[1]}"
            patch="${BASH_REMATCH[2]}"
            if (( patch < 9 )); then
              ((patch += 1))
            else
              ((minor += 1))
              patch=0
            fi
            version="ios-v1.${minor}.${patch}"
            version_name="1.${minor}.${patch}"
            version_code="$((10000 + minor * 10 + patch))"
          else
            echo "Unsupported existing iOS tag format: $latest" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Check Apple signing secrets
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$CERTIFICATE_BASE64" || { echo "Missing secret IOS_CERTIFICATE_BASE64"; exit 1; }
          test -n "$CERTIFICATE_PASSWORD" || { echo "Missing secret IOS_CERTIFICATE_PASSWORD"; exit 1; }
          test -n "$PROVISIONING_PROFILE_BASE64" || { echo "Missing secret IOS_PROVISIONING_PROFILE_BASE64"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clientlourd/parkinglogickit/package-lock.json

      - name: Set up npm
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build

      - name: Synchronize Capacitor iOS project
        run: npx cap sync ios

      - name: Install Apple signing certificate and profile
        id: signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          certificate_path="$RUNNER_TEMP/signing-certificate.p12"
          profile_path="$RUNNER_TEMP/profile.mobileprovision"
          profile_plist="$RUNNER_TEMP/profile.plist"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 -D > "$profile_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$profile_plist")
          profile_name=$(/usr/libexec/PlistBuddy -c "Print :Name" "$profile_plist")
          team_id=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$profile_plist")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"

          echo "profile_name=$profile_name" >> "$GITHUB_OUTPUT"
          echo "team_id=$team_id" >> "$GITHUB_OUTPUT"

      - name: Archive and export IPA
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
        run: |
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          archive_path="$RUNNER_TEMP/ParkingLogicKit.xcarchive"
          export_path="$RUNNER_TEMP/ipa-export"

          cat > "$export_options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$IOS_EXPORT_METHOD</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$IOS_BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$VERSION_CODE" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IOS_CODE_SIGN_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

          xcodebuild -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options"

          ipa_path="$(find "$export_path" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          cp "$ipa_path" plk.ipa

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" plk.ipa --title "$VERSION" --generate-notes --target "$GITHUB_SHA"

      - name: Send IPA to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_IOS_RELEASE }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}
        run: |
          test -n "$DISCORD_WEBHOOK_URL"
          curl --fail-with-body \
            -F "payload_json={\"content\":\"Nouvelle release iPhone **${VERSION}** disponible : ${RELEASE_URL}\"}" \
            -F "files[0]=@plk.ipa;type=application/octet-stream;filename=plk.ipa" \
            "$DISCORD_WEBHOOK_URL"
