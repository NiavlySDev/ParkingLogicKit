name: Deploy serveurweb to remote server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy WAR
    runs-on: ubuntu-latest

    env:
      WAR_NAME: parkinglogickit-serveurweb-1.0.0-SNAPSHOT.war
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      WILDFLY_HOME: /home/minecraft/wildfly
      SOURCE_PATH: /opt/sites/projet/ParkingLogicKit
      WILDFLY_DEPLOY_PATH: /home/minecraft/wildfly/standalone/deployments
      DEPLOY_RESTART_COMMAND: ${{ secrets.DEPLOY_RESTART_COMMAND }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven

      - name: Install LML dependencies
        run: |
          cd libs
          mvn clean install -DskipTests -N
          cd libLML
          mvn clean install -DskipTests
          cd ../..

      - name: Build serveurweb
        run: |
          chmod +x mvnw
          ./mvnw -B -U -DskipTests -pl serveurweb -am package

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" | sed 's/\\n/\n/g' | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload source code to server
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p "$DEPLOY_PORT" \
              -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "mkdir -p '$SOURCE_PATH'"

          tar \
              --exclude='.git' \
              --exclude='*/target' \
              --exclude='target' \
              -czf - . | ssh -i ~/.ssh/deploy_key \
              -p "$DEPLOY_PORT" \
              -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "tar -xzf - -C '$SOURCE_PATH'"

      - name: Upload WAR to WildFly
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p "$DEPLOY_PORT" \
              -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "mkdir -p '$WILDFLY_DEPLOY_PATH'"

          scp -i ~/.ssh/deploy_key \
              -P "$DEPLOY_PORT" \
              -o StrictHostKeyChecking=yes \
              "serveurweb/target/$WAR_NAME" \
              "$DEPLOY_USER@$DEPLOY_HOST:$WILDFLY_DEPLOY_PATH/$WAR_NAME"

      - name: Trigger WildFly deployment
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p "$DEPLOY_PORT" \
              -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "cd '$WILDFLY_DEPLOY_PATH' && rm -f '$WAR_NAME'.failed '$WAR_NAME'.deployed '$WAR_NAME'.isdeploying && touch '$WAR_NAME'.dodeploy"

      - name: Restart WildFly
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p "$DEPLOY_PORT" \
              -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "DEPLOY_RESTART_COMMAND='$DEPLOY_RESTART_COMMAND' WILDFLY_HOME='$WILDFLY_HOME' DEPLOY_USER='$DEPLOY_USER' bash -s" <<'REMOTE_SCRIPT'
          set -e

          if [ -n "$DEPLOY_RESTART_COMMAND" ]; then
            eval "$DEPLOY_RESTART_COMMAND"
          elif command -v systemctl >/dev/null 2>&1 && systemctl --user list-unit-files | grep -q '^wildfly'; then
            systemctl --user restart wildfly || systemctl --user start wildfly
          elif command -v sudo >/dev/null 2>&1 && sudo -n systemctl status wildfly >/dev/null 2>&1; then
            sudo -n systemctl restart wildfly || sudo -n systemctl start wildfly
          elif [ -x "$WILDFLY_HOME/bin/jboss-cli.sh" ] && "$WILDFLY_HOME/bin/jboss-cli.sh" --connect command=':shutdown(restart=true)'; then
            echo 'WildFly redémarré avec jboss-cli.'
          elif [ -x "$WILDFLY_HOME/bin/standalone.sh" ]; then
            if pgrep -u "$DEPLOY_USER" -f "$WILDFLY_HOME.*standalone" >/dev/null 2>&1; then
              pkill -u "$DEPLOY_USER" -f "$WILDFLY_HOME.*standalone"
              sleep 5
            fi
            nohup "$WILDFLY_HOME/bin/standalone.sh" -b 0.0.0.0 > "$WILDFLY_HOME/standalone/log/standalone.out" 2>&1 &
            echo 'WildFly démarré en arrière-plan.'
          else
            echo 'Aucune commande de redémarrage WildFly trouvée. Ajoute le secret DEPLOY_RESTART_COMMAND.'
            exit 1
          fi
          REMOTE_SCRIPT
